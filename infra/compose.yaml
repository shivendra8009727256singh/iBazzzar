name: ibazzzar-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ibazzzar_dev
      POSTGRES_USER: ibazzzar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["ibazzzar_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibazzzar -d ibazzzar_dev"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["ibazzzar_redis:/data"]
volumes:
  ibazzzar_pg:
  ibazzzar_redis:
