# Single-server production layout (VPS or VM). PostgreSQL is a managed service (e.g. Aiven) configured in .env.
# Put a TLS-terminating reverse proxy (Caddy, Nginx or a cloud load balancer) in front of the "web" service on :3000.
#   docker compose -f infra/compose.production.yaml --env-file .env up -d --build
name: ibazzzar
services:
  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    env_file: ../.env
    environment: { NODE_ENV: production, HOST: 0.0.0.0, PORT: "4000", REDIS_URL: "redis://redis:6379", TRUST_PROXY: "1" }
    depends_on: [redis]
    restart: unless-stopped
  worker:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    command: ["node", "apps/worker/src/index.js"]
    env_file: ../.env
    environment: { NODE_ENV: production, REDIS_URL: "redis://redis:6379" }
    depends_on: [redis]
    restart: unless-stopped
  web:
    build: { context: .., dockerfile: infra/Dockerfile.web }
    environment: { API_ORIGIN: "http://api:4000", NEXT_PUBLIC_SITE_URL: "https://ibazzzar.com" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    restart: unless-stopped
volumes:
  redis:
