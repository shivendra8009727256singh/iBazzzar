      summary: "Approved sellers"
      x-access: public
      responses:
        '200': {description: OK}
  /api/support/queue:
    get:
      summary: "All tickets (support staff)"
      x-access: support
      security: [{session: []}]
      responses:
        '200': {description: OK}
  /api/support/queue/{id}:
    patch:
      summary: "Open or close a ticket"
      x-access: support
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      security: [{session: []}]
      responses:
        '200': {description: OK}
  /api/support/queue/{id}/messages:
    post:
      summary: "Reply as support"
      x-access: support
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      security: [{session: []}]
      responses:
        '200': {description: OK}
  /api/support/tickets:
    get:
      summary: "My support tickets"
      x-access: signed in
      security: [{session: []}]
      responses:
        '200': {description: OK}
    post:
      summary: "Open a ticket"
      x-access: signed in
      security: [{session: []}]
      responses:
        '200': {description: OK}
  /api/support/tickets/{id}/messages:
    post:
      summary: "Reply on my ticket"
      x-access: signed in
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      security: [{session: []}]
      responses:
        '200': {description: OK}
